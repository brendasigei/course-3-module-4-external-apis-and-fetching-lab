<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Alerts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Weather Alerts</h1>
    <p>Enter a two-letter U.S. state abbreviation to see active alerts.</p>

    <div class="search">
      <input type="text" id="state-input" placeholder="Enter state abbreviation (e.g. CA)" maxlength="2">
      <button id="fetch-alerts">Get Alerts</button>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <span>Loading alerts...</span>
    </div>

    <div id="error-message" class="hidden"></div>
    <div id="alerts-display"></div>
  </main>

  <script src="index.js"></script>
</body>
</html>
